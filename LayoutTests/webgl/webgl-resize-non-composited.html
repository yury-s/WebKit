<!DOCTYPE html><!-- webkit-test-runner [ AcceleratedCompositingEnabled=false ] -->
<html>
<body style="margin: 0">
<canvas style="width: 100px; height: 100px"></canvas>
<script>
// A non-composited WebGL canvas should still be painted after its drawing buffer is resized.
if (window.testRunner)
    testRunner.waitUntilDone();

const canvas = document.querySelector("canvas");
const gl = canvas.getContext("webgl");

function draw(size) {
    canvas.width = size;
    canvas.height = size;
    gl.viewport(0, 0, size, size);
    gl.clearColor(0, 1, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
}

draw(100);
// Let the first frame be displayed before resizing the drawing buffer.
requestAnimationFrame(() => {
    requestAnimationFrame(() => {
        draw(50);
        requestAnimationFrame(() => {
            if (window.testRunner)
                testRunner.notifyDone();
        });
    });
});
</script>
</body>
</html>
